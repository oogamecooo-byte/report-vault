<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);overflow:hidden}
body{font-family:Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}

header{position:absolute;left:44px;top:26px;right:44px;display:flex;align-items:flex-end;justify-content:space-between}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em}

#panel{position:absolute;right:40px;top:100px;width:360px;bottom:92px;border-radius:18px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(8px);padding:22px 22px 18px;display:flex;flex-direction:column;gap:13px}

.box h3{font-size:12.5px;color:var(--ink2);font-weight:600;margin-bottom:7px}
.claim{font-size:12.8px;line-height:1.55;padding:6px 0;border-top:1px solid var(--line)}
.claim:first-of-type{border-top:0}.claim i{font-style:normal;color:var(--ink3);font-size:11px;margin-left:4px}
.calc{font-size:13px;line-height:1.55}.calc em{font-style:normal;color:var(--blue1);font-weight:700}
footer{position:absolute;left:330px;right:430px;bottom:22px;display:flex;gap:20px;align-items:center;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.sw{display:inline-block;width:22px;height:8px;border-radius:4px;margin-right:7px;vertical-align:1px}
.note{color:var(--ink3);font-size:12px;width:100%}
</style>

<script>
(function fit(){const s=document.getElementById('stage');const f=()=>{const k=Math.min(innerWidth/1600,innerHeight/900);s.style.transform=`translate(-50%,-50%) scale(${k})`};addEventListener('resize',f);f()})();
/* 숲 배경(낮은 대비) */
(function(){const svg=document.getElementById('forest'),NS='http://www.w3.org/2000/svg';let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
 const defs=document.createElementNS(NS,'defs');defs.innerHTML='<linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe8d8" stop-opacity="0"/><stop offset=".5" stop-color="#cfe8d8" stop-opacity=".05"/><stop offset="1" stop-color="#cfe8d8" stop-opacity="0"/></linearGradient>';svg.appendChild(defs);
 function pine(x,base,h,w,col,op){const g=document.createElementNS(NS,'path');let d='';for(let i=0;i<4;i++){const t=i/4,ty=base-h*t-h*.08,ww=w*(1-t*.62),hh=h*.42;d+=`M${x-ww/2},${ty} L${x},${ty-hh} L${x+ww/2},${ty} Z `}d+=`M${x-w*.05},${base} L${x-w*.05},${base-h*.12} L${x+w*.05},${base-h*.12} L${x+w*.05},${base} Z`;g.setAttribute('d',d);g.setAttribute('fill',col);g.setAttribute('opacity',op);svg.appendChild(g)}
 [[860,150,90,'#123022',.55,26],[880,190,120,'#0f2a1d',.7,22],[900,240,150,'#0b2118',.9,17]].forEach(([b,hm,hv,c,o,n])=>{for(let i=0;i<n;i++){const x=-40+i*(1680/n)+rnd()*50,h=hm+rnd()*hv;pine(x,b+40,h,h*.48,c,o)}});
 for(let i=0;i<18;i++){const x=rnd()*1600,h=60+rnd()*70;pine(x,40+rnd()*30,h,h*.5,'#10291c',.35)}
 const m=document.createElementNS(NS,'rect');m.setAttribute('x',0);m.setAttribute('y',560);m.setAttribute('width',1600);m.setAttribute('height',240);m.setAttribute('fill','url(#mist)');svg.appendChild(m)})();

const ROWS=[
 {y:110,n:'0',name:'돈을 내는 쪽',ex:'개인 · 기업 · 정부'},
 {y:196,n:'1',name:'AI 서비스',ex:'챗봇 구독 · 업무용 AI · 도입 대행'},
 {y:282,n:'2',name:'AI 작업 도구',ex:'모델 회사 도구 · 독립 도구'},
 {y:368,n:'3',name:'AI 모델',ex:'폐쇄형 고가·저가 | 오픈 저가·무료'},
 {y:604,n:'4',name:'클라우드',ex:'GPU를 빌려주고 모델을 돌리는 곳'},
 {y:712,n:'5',name:'클라우드가 돈을 쓰는 곳',ex:'칩·서버 | 건물·전력 연결 | 전기 요금'},
 {y:800,n:'6',name:'그 아래 공급망',ex:'반도체 | 전력·냉각 장비 | 발전'},
];
const lab=document.getElementById('labels');
ROWS.forEach(r=>{const d=document.createElement('div');d.className='lab';d.style.top=(r.y-12)+'px';d.innerHTML=`<span class="n">${r.n}</span><b>${r.name}</b><p>${r.ex}</p>`;lab.appendChild(d)});

const X0=410,XW=720;
/* lane: c=폐쇄형 길, o=오픈 길, s=공통 */
const N={per:[0,'개인',.06,'s'],ent:[0,'기업',.3,'s'],gov:[0,'정부',.52,'s'],
 chat:[1,'챗봇 구독',.06,'s'],work:[1,'업무용 AI',.24,'s'],ax:[1,'도입 대행',.4,'s'],
 tlab:[2,'모델 회사 도구',.1,'c'],tind:[2,'독립 도구',.48,'s'],
 ch:[3,'폐쇄형 고가',.06,'c'],cl:[3,'폐쇄형 저가',.22,'c'],op:[3,'오픈 저가',.6,'o'],of:[3,'오픈 무료',.76,'o'],
 cloud:[4,'클라우드',.42,'s'],chip:[5,'칩·서버',.26,'s'],bld:[5,'건물·전력 연결',.62,'s'],ele:[5,'전기',.86,'s'],
 semi:[6,'반도체 공급망',.26,'s'],grid:[6,'전력·냉각 장비',.62,'s'],gen:[6,'발전',.86,'s']};
function flows(sh){ /* sh = 오픈 비율. 반환 [from,to,v,lane,dashed] */
 const o=sh,c=1-sh,F=[];const add=(a,b,v,l,d)=>{if(v>0.05)F.push([a,b,v,l||'s',d||0])};
 add('per','chat',40);add('ent','work',60);add('ent','ax',20);add('gov','ax',10);add('ent','tlab',10);add('ent','tind',8);
 add('ent','cloud',45);add('gov','cloud',10);add('work','cloud',15);
 const D=85; /* 기업 API 직접 */
 add('chat','ch',40,'c');add('tlab','ch',9,'c');
 const split=(src,v)=>{add(src,'ch',v*c*.8,'c');add(src,'cl',v*c*.2,'c');add(src,'op',v*o*.7,'o');add(src,'of',v*o*.3,'o',1)};
 split('ent',D);split('work',12);split('ax',5);split('tind',7);
 F.push(['__mo']);
 return F;}
const SIDE={vc:['ch',30,'벤처·국부 자본','r'],credit:['cloud',170,'은행·사모신용·채권','r'],cash:['cloud',450,'빅테크 본업 현금','g']};
const INNER=[['chip','ch',20,'칩 회사 → 모델 회사 신용'],['cloud','ch',25,'빅테크 → 모델 회사 지분투자']];
const PER={'2023':{k:.11,band:0},'2026':{k:1,band:0},'2030':{k:1.6,band:.35}};
let period='2026',share=.11,lane='all',cur=3;
const svg=document.getElementById('flow'),NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
function draw(){
 svg.innerHTML='';const {k}=PER[period],S=.4*k*(period==='2030'?.72:1);
 const defs=el('defs',{});
 defs.innerHTML=`<linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff" stop-opacity=".78"/><stop offset="1" stop-color="#2f7fe0" stop-opacity=".55"/></linearGradient>
 <linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ff0ea" stop-opacity=".8"/><stop offset="1" stop-color="#2bb5c4" stop-opacity=".55"/></linearGradient>
 <linearGradient id="gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6b5e" stop-opacity=".12"/><stop offset="1" stop-color="#ff6b5e" stop-opacity=".72"/></linearGradient>
 <linearGradient id="gg" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#e8b85a" stop-opacity=".12"/><stop offset="1" stop-color="#e8b85a" stop-opacity=".7"/></linearGradient>`;
 let F=flows(share).filter(f=>f[0]!=='__mo');
 const vin={},vout={};for(const id in N){vin[id]=0;vout[id]=0}
 F.forEach(([a,b,v])=>{vout[a]+=v;vin[b]+=v});
 /* 모델 → 클라우드(컴퓨트 비용): 폐쇄형은 매출의 85% + 투자금, 오픈 저가 80%, 오픈 무료 100% */
 const toCloud=[['ch',vin.ch*.85+SIDE.vc[1],'c',0],['cl',vin.cl*.85,'c',0],['op',vin.op*.8,'o',0],['of',vin.of,'o',1]];
 toCloud.forEach(([a,v,l,d])=>{if(v>.05){F.push([a,'cloud',v,l,d]);vout[a]+=v;vin.cloud+=v}});
 [['cloud','chip',500],['cloud','bld',300],['cloud','ele',12],['chip','semi',170],['bld','grid',110],['ele','gen',12]].forEach(([a,b,v])=>{F.push([a,b,v,'s',0]);vout[a]+=v;vin[b]+=v});
 vin.ch+=SIDE.vc[1];vin.cloud+=SIDE.credit[1]+SIDE.cash[1];
 const val={};for(const id in N)val[id]=Math.max(vin[id],vout[id]);
 const W=id=>Math.max(val[id]*S,3),cx=id=>X0+XW*N[id][2],ry=id=>ROWS[N[id][0]].y,H=11;
 const off={};for(const id in N)off[id]={o:0,i:0};
 const dim=l=>lane==='all'||l==='s'?1:(l===(lane==='closed'?'c':'o')?1:.08);
 /* 갈림 구간 표시 */
 const zy0=ROWS[2].y-50,zy1=ROWS[4].y-6;
 el('rect',{x:X0-30,y:zy0,width:XW+60,height:zy1-zy0,rx:22,fill:'rgba(233,242,236,.025)',stroke:'rgba(233,242,236,.08)','stroke-dasharray':'4 6'});
 el('text',{x:X0+XW*.12,y:zy0+18,'font-size':12,'font-weight':700,fill:'#7cc4ff','text-anchor':'middle'}).textContent='폐쇄형 길';
 el('text',{x:X0+XW*.68,y:zy0+18,'font-size':12,'font-weight':700,fill:'#7fe6e0','text-anchor':'middle'}).textContent='오픈 길';
 el('text',{x:X0+XW*.42,y:ROWS[4].y+H+34,'font-size':11.5,fill:'#8fb09c','text-anchor':'middle'}).textContent='같은 GPU에서 두 길이 다시 합쳐짐';
 /* 클릭 영역 */
 for(let r=0;r<ROWS.length-1;r++){const g=el('g',{class:'gap'});el('rect',{x:X0-20,y:ROWS[r].y+H+4,width:XW+40,height:ROWS[r+1].y-ROWS[r].y-H-8,rx:14,fill:'transparent'},g);g.addEventListener('click',()=>{cur=r;showGap(r)})}
 /* 옆에서 들어오는 돈(먼저 그려 뒤에 깔림) */
 const blueIn=id=>F.filter(f=>f[1]===id).reduce((a,f)=>a+f[2],0)*S;
 const side=(key,fromLeft)=>{const [tgt,v,name,kind]=SIDE[key];const w=Math.max(v*S,3),y=ROWS[N[tgt][0]].y;
  let x1=fromLeft?cx(tgt)-W(tgt)/2+blueIn(tgt)+(key==='credit'?0:0):cx(tgt)+W(tgt)/2-w;
  const xs=fromLeft?X0-70:X0+XW+60,yb=y-22,yt=yb-w;
  const d=fromLeft?`M${xs},${yt} L${x1-10},${yt} C${x1+w*.7},${yt} ${x1+w},${yt+w*.4} ${x1+w},${y} L${x1},${y} C${x1},${yb+6} ${x1-4},${yb} ${x1-14},${yb} L${xs},${yb} Z`
   :`M${xs},${yt} L${x1+w+10},${yt} C${x1+w*.3},${yt} ${x1},${yt+w*.4} ${x1},${y} L${x1+w},${y} C${x1+w},${yb+6} ${x1+w+4},${yb} ${x1+w+14},${yb} L${xs},${yb} Z`;
  el('path',{d,fill:`url(#${kind==='r'?'gr':'gg'})`,class:'ribbon'});
  const inside=w>=22,tx=el('text',{x:fromLeft?xs+10:xs-10,y:inside?yt+w/2+4.5:yt-7,'text-anchor':fromLeft?'start':'end','font-size':13,'font-weight':700,fill:inside?(fromLeft?'#ffe3df':'#2a1d05'):(fromLeft?'#ff9a8f':'#efc97a')});
  tx.textContent=name+' ';el('tspan',{'font-weight':500,fill:inside?(fromLeft?'#ffc9c2':'#5a4312'):'#8fb09c'},tx).textContent=Math.round(v*k)};
 side('cash',false);side('credit',true);side('vc',true);
 /* 리본 */
 F.sort((p,q)=>N[p[1]][0]-N[q[1]][0]||N[p[1]][2]-N[q[1]][2]||N[p[0]][2]-N[q[0]][2]).forEach(([a,b,v,l,dsh])=>{
  const w=Math.max(v*S,.6),x0=cx(a)-W(a)/2+off[a].o,x1=cx(b)-W(b)/2+off[b].i;off[a].o+=v*S;off[b].i+=v*S;
  const y0=ry(a)+H,y1=ry(b),ym=(y0+y1)/2;
  const d=`M${x0},${y0} C${x0},${ym} ${x1},${ym} ${x1},${y1} L${x1+w},${y1} C${x1+w},${ym} ${x0+w},${ym} ${x0+w},${y0} Z`;
  const fill=dsh?'none':(l==='o'?'url(#gt)':'url(#gb)');
  const p=el('path',{d,class:'ribbon',fill,opacity:(dsh?1:.66)*dim(l),stroke:dsh?'#9ff0ea':'none','stroke-dasharray':dsh?'5 4':'','stroke-width':1});
  el('title',{},p).textContent=`${N[a][1]} → ${N[b][1]} · 약 ${Math.round(v*k)}`});
 /* AI 안 투자·신용(아래→위) */
 INNER.forEach(([a,b,v],i)=>{const xa=cx(a)-W(a)/2+4+i*10,ya=ry(a)-3,xb=cx(b)-W(b)/2+3+i*8,yb=ry(b)+H+3,bx=X0-40-i*22;
  el('path',{d:`M${xa},${ya} C${bx},${ya-30} ${bx},${yb+40} ${xb},${yb}`,fill:'none',stroke:'#ff9fb0','stroke-width':2.2,opacity:.85*dim('c'),'stroke-linecap':'round'});
  el('path',{d:`M${xb-3},${yb+11} L${xb},${yb} L${xb+9},${yb+6}`,fill:'none',stroke:'#ff9fb0','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round',opacity:dim('c')})});
 /* 노드 */
 for(const id in N){const x=cx(id)-W(id)/2,y=ry(id),w=W(id),dashed=id==='of',l=N[id][3];
  el('rect',{x,y,width:w,height:H,rx:5.5,fill:dashed?'none':(l==='o'?'#cdf6f2':'#e9f2ec'),stroke:dashed?'#9ff0ea':'none','stroke-dasharray':dashed?'4 3':'',opacity:(dashed?.95:.92)*dim(l)});
  const t=el('text',{x:cx(id),y:y-7,'text-anchor':'middle','font-size':12.5,'font-weight':600,fill:'#e9f2ec',opacity:dim(l)});
  t.textContent=N[id][1];el('tspan',{fill:'#8fb09c','font-weight':500,dx:5},t).textContent=Math.round(val[id]*k)}
}

 p.innerHTML=`<div class="k">층 사이 · ${period}</div><h2>${g.t}</h2>
