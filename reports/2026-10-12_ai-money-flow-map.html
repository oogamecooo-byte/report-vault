  const path=(x0,x1,w)=>`M${x0},${y0} C${x0},${ym} ${x1},${ym} ${x1},${y1} L${x1+w},${y1} C${x1+w},${ym} ${x0+w},${ym} ${x0+w},${y0} Z`;
  const free=b==='of'||(a==='of');
  if(f.g==='시나리오'&&f.hi>f.m){const wh=f.hi*S,dx=(wh-w)/2;el('path',{d:path(x0-dx,x1-dx,wh),fill:l==='o'?'#9ff0ea':'#7cc4ff',opacity:.09*dim(l)})}
  const fill=free?'none':(l==='o'?'url(#gt)':'url(#gb)');
  const op=(free?1:(f.g==='공시'?.68:f.g==='추정'?.42:.36))*dim(l);
  const p=el('path',{d:path(x0,x1,w),class:'ribbon'+(focus===f.id?' hl':''),fill,opacity:op*(lens?GW[f.g]||.3:1),stroke:free?'#9ff0ea':(f.g==='공시'?'none':(l==='o'?'#9ff0ea':'#9ccfff')),'stroke-dasharray':f.g==='공시'&&!free?'':'4 4','stroke-width':.9});
  hover(p,`<b>${N[a].name} → ${N[b].name}</b><br>${period}: ${fmt(f.m)}${f.lo!==f.hi?` (범위 ${fmt(f.lo)}~${fmt(f.hi)})`:''} · ${f.g}<br><span style="color:#e8b85a">누르면 근거 카드</span>`,f.src);p.style.cursor='pointer';p.addEventListener('click',e=>{e.stopPropagation();evid({title:`${N[a].name} → ${N[b].name}`,m:f.m,lo:f.lo,hi:f.hi,g:f.g,basis:f.basis,calc:f.calc,src:f.src,id:f.id})})});
 INNER.forEach((x,i)=>{const xa=cx(x.from)-W(x.from)/2+4+i*10,ya=ry(x.from)-3,xb=cx(x.to)-W(x.to)/2+3+i*8,yb=ry(x.to)+H+3,bx=X0-40-i*22;
  const p=el('path',{d:`M${xa},${ya} C${bx},${ya-30} ${bx},${yb+40} ${xb},${yb}`,fill:'none',stroke:'#ff9fb0','stroke-width':Math.min(Math.max(x.m*S*.4,2),6),opacity:.85*dim('c'),'stroke-linecap':'round'});
  hover(p,`<b>${x.name}</b><br>${period}: ${fmt(x.m)}<br><span style="color:#e8b85a">누르면 근거 카드</span>`,x.src);p.style.cursor='pointer';p.addEventListener('click',e=>{e.stopPropagation();const v=x.v[period];evid({title:x.name,m:x.m,lo:v.lo,hi:v.hi,g:(x.grade||{})[period]||'추정',basis:x.basis,calc:x.calc,src:x.src,id:x.id})});
  el('path',{d:`M${xb-3},${yb+11} L${xb},${yb} L${xb+9},${yb+6}`,fill:'none',stroke:'#ff9fb0','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round',opacity:dim('c')})});
 for(const id in N){const x=cx(id)-W(id)/2,y=ry(id),w=W(id),dashed=id==='of',l=N[id].lane,cc=cake&&CAKE[id]?CAKEC[CAKE[id]]:null;
  el('rect',{x,y,width:w,height:H,rx:5.5,fill:dashed?'none':(cc||(l==='o'?'#cdf6f2':'#e9f2ec')),stroke:dashed?(cc||'#9ff0ea'):'none','stroke-dasharray':dashed?'4 3':'',opacity:(dashed?.95:.92)*dim(l)});
  const t=el('text',{x:cx(id),y:y-7,'text-anchor':'middle','font-size':12.5,'font-weight':600,fill:'#e9f2ec',opacity:dim(l)});
  t.textContent=N[id].name;el('tspan',{fill:'#8fb09c','font-weight':500,dx:5},t).textContent=fmt(val[id]);
  if(cc){el('text',{x:cx(id),y:y+H+13,'text-anchor':'middle','font-size':10.5,'font-weight':700,fill:cc,opacity:dim(l)}).textContent=CAKE[id]}}
 document.getElementById('sub').textContent=`v0.2 · 기준일 ${DATA.meta.asof} · 작성 ${DATA.meta.author} · 사용자 판단 미포함${shareNote?' · ⚠ '+shareNote:''}`;
 document.getElementById('unit').textContent=`채움 = 공시 · 점선 = 추정 · 옅은 띠 = 시나리오 범위 · 단위 10억 달러 · ${same?'세 기간 같은 눈금':'기간별 눈금'}`;
}
function srcLinks(ids,acc){return (ids||[]).map(id=>{if(!SRC[id])return'';if(!acc.includes(id))acc.push(id);return `<sup><a href="${SRC[id].url}" target="_blank" rel="noopener">[${acc.indexOf(id)+1}]</a></sup>`}).join('')}
function hover(node,html,src){node.addEventListener('mousemove',e=>{const r=document.getElementById('stage').getBoundingClientRect(),k=r.width/1600;tip.style.display='block';tip.style.left=((e.clientX-r.left)/k+14)+'px';tip.style.top=((e.clientY-r.top)/k+14)+'px';tip.innerHTML=html+((src&&src.length)?`<br><span style="color:#6f8a7a">출처: ${src.map(s=>SRC[s]?SRC[s].org:'').filter(Boolean).join(' · ')}</span>`:'')});node.addEventListener('mouseleave',()=>tip.style.display='none')}
function showGap(){const g=DATA.gaps.find(x=>x.r===cur),acc=[];const box=document.getElementById('gap');
 if(!g){box.innerHTML='<div class="k">자료 없음</div>';return}
 const P=g.periods[period]||{series:[],claims:[{who:'',text:'이 기간 자료 없음',src:[]}],calc:{text:'',src:[]}};
 const S=P.series||[],mx=Math.max(1,...S.map(s=>s.v||0));
 const bars=S.map((s,i)=>{const h=(s.v||0)/mx*70,x=8+i*(300/Math.max(S.length,1));return `<rect x="${x}" y="${84-h}" width="${Math.min(46,260/Math.max(S.length,1))}" height="${h}" rx="5" fill="#7cc4ff" opacity=".85"/><text x="${x}" y="100" font-size="10.5" fill="#a9bfb1">${s.label}</text><text x="${x}" y="${80-h}" font-size="11" font-weight="700" fill="#e9f2ec">${fmt(s.v||0)}</text>`}).join('');
 box.innerHTML=`<div class="k">층 사이 · ${period}</div><h2>${g.title}</h2>${S.length?`<svg width="330" height="106">${bars}</svg>`:''}
 <div>${(P.claims||[]).slice(0,4).map(c=>`<div class="claim"><span class="who">${c.who||''}</span>${c.text}${srcLinks(c.src,acc)}</div>`).join('')}</div>
 ${P.calc&&P.calc.text?`<div class="calc"><b>Claude 계산</b> · ${P.calc.text}${srcLinks(P.calc.src,acc)}</div>`:''}
 <div class="srcs">${acc.map((id,i)=>`[${i+1}] <a href="${SRC[id].url}" target="_blank" rel="noopener">${SRC[id].org} · ${SRC[id].title}</a> (${SRC[id].date})`).join('<br>')}</div>`}
function showRC(){const box=document.getElementById('rc');const CAP=2.5,W=170;
 const rows=DATA.recovery.map((r,i)=>{const p=r.periods[period];if(!p)return `<div class="rrow"><span class="nm">${r.layer}</span><span style="font-size:11px;color:#6f8a7a">자료 없음</span><span></span></div>`;
  if(!p.inflow||!p.burden||p.inflow.mid==null||p.burden.mid==null)return `<div class="rrow"><span class="nm">${r.layer}</span><span style="font-size:11px;color:#6f8a7a">이 기간 자료 없음</span><span></span></div>`;
  const lo=(p.inflow.lo??p.inflow.mid)/(p.burden.hi??p.burden.mid),mid=p.inflow.mid/p.burden.mid,hi=(p.inflow.hi??p.inflow.mid)/(p.burden.lo??p.burden.mid),X=v=>Math.min(v,CAP)/CAP*W,col=mid>=1?'#7ddf9c':'#ff8a7a';
  return `<div class="rrow" data-i="${i}"><span class="nm">${r.layer}</span><svg width="${W}" height="18"><rect x="0" y="7" width="${W}" height="4" rx="2" fill="rgba(233,242,236,.08)"/><rect x="${X(lo)}" y="5" width="${Math.max(X(hi)-X(lo),2)}" height="8" rx="4" fill="${col}" opacity=".3"/><line x1="${X(1)}" x2="${X(1)}" y1="1" y2="17" stroke="#e9f2ec" stroke-opacity=".55" stroke-dasharray="2 2"/><circle cx="${X(mid)}" cy="9" r="5" fill="${col}"/></svg><span class="nv" style="color:${col}">${mid.toFixed(2)}배</span></div>`}).join('');
 box.innerHTML=`<h3>회수 게이지 · ${period}<span>점선 = 1배 · 비용만 메움(이익 아님)</span></h3>${rows}<div style="font-size:10.5px;color:#6f8a7a;margin-top:9px;line-height:1.45">회수율 = 그 층이 1년에 고객에게서 받는 AI 돈 ÷ 그 층이 매년 털어내야 할 비용(Claude 정의). 1배를 넘어도 운영비·자본수익을 빼기 전이라 이익을 뜻하지 않습니다. 산업 전체 줄만 10% 자본수익을 더한 JP모건식 기준선. 줄을 누르면 근거가 열립니다.</div>`;
 box.querySelectorAll('.rrow[data-i]').forEach(el=>el.addEventListener('click',()=>{const r=DATA.recovery[+el.dataset.i],p=r.periods[period],acc=[];if(!p||!p.inflow||!p.burden||p.burden.mid==null)return;
  document.getElementById('gap').innerHTML=`<div class="k">회수 게이지 · ${period}</div><h2>${r.layer} — ${r.what}</h2>
  <div class="claim"><span class="who">고객에게서 받는 돈</span>${fmt(p.inflow.mid)} (범위 ${fmt(p.inflow.lo)}~${fmt(p.inflow.hi)})</div>
  <div class="claim"><span class="who">${p.burden_label||'털어낼 비용'}</span>${fmt(p.burden.mid)} (범위 ${fmt(p.burden.lo)}~${fmt(p.burden.hi)})</div>
  <div class="calc"><b>Claude 계산</b> · ${p.calc||''} · 등급 ${p.grade||''}${srcLinks(p.src,acc)}</div>
  <div class="srcs">${acc.map((id,i)=>`[${i+1}] <a href="${SRC[id].url}" target="_blank" rel="noopener">${SRC[id].org} · ${SRC[id].title}</a> (${SRC[id].date})`).join('<br>')}</div>`}))}

function srcType(id){const u=(SRC[id]&&SRC[id].url||'').toLowerCase(),o=(SRC[id]&&SRC[id].org||'');
 if(SRC[id]&&SRC[id].type)return SRC[id].type;
 if(/sec\.gov|investor|\/ir\b|ir\./.test(u)||/10-q|10-k|8-k|6-k/i.test(SRC[id].title||''))return '기업 공시';
 if(/\.gov|europa\.eu|worldbank|imf\.org|iea\.org|fred|census|bea\./.test(u))return '정부·국제기구 통계';
 if(/reuters|bloomberg|cnbc|ft\.com|wsj|axios|theinformation|lemonde|yahoo|guardian/.test(u))return '보도';
 if(/claude/i.test(o))return 'Claude 계산';
 return '기관 리서치·회사 발표'}
function evid(o){focus=o.id;draw();const acc=[];const box=document.getElementById('gap');
 box.innerHTML=`<div class="k">근거 카드 · ${period}</div><h2>${o.title}<span class="badge b-${o.g}">${o.g}</span></h2>
 <div class="claim"><span class="who">금액</span>${fmt(o.m)}${o.lo!=null&&o.lo!==o.hi?` · 범위 ${fmt(o.lo)}~${fmt(o.hi)}`:''} · 10억 달러${o.basis?` · ${o.basis}`:''}</div>
 ${o.ann&&o.ann.note?`<div class="claim"><span class="who">발표된 건 합계</span>${o.ann.period||''} · ${o.ann.to_cloud_credit_x2!=null?fmt(o.ann.to_cloud_credit_x2)+' · ':''}${o.ann.note}</div>`:''}
 ${o.calc?`<div class="calc"><b>어떻게 얻었나</b> · ${o.calc}${srcLinks(o.src,acc)}</div>`:''}
 <div class="srcs" style="margin-top:4px">${(o.src||[]).filter(id=>SRC[id]).map(id=>`<div style="padding:4px 0;border-top:1px solid rgba(233,242,236,.12)"><span style="color:#e8b85a">${srcType(id)}</span><br><a href="${SRC[id].url}" target="_blank" rel="noopener">${SRC[id].org} · ${SRC[id].title}</a> (${SRC[id].date})</div>`).join('')||'출처 없음 — Claude 추정'}</div>
 <div style="font-size:10.5px;color:#6f8a7a">빈 곳을 누르면 강조가 풀립니다</div>`}
function usedIn(p){const m={};const add=(ids,label)=>(ids||[]).forEach(id=>{(m[id]=m[id]||[]).push(label)});
 DATA.flows.forEach(f=>{if(f.v[p]&&f.v[p].mid>0)add(f.src,{id:f.id,t:`${nm(f.from)}→${nm(f.to)}`})});
 DATA.side.forEach(x=>{if(x.v[p])add(x.src,{id:x.id,t:x.name})});DATA.inner.forEach(x=>{if(x.v[p])add(x.src,{id:x.id,t:x.name})});
 DATA.gaps.forEach(g=>{const P=g.periods[p];if(!P)return;(P.claims||[]).forEach(c=>add(c.src,{gap:g.r,t:'패널: '+g.title}));if(P.calc)add(P.calc.src,{gap:g.r,t:'패널: '+g.title})});
 DATA.recovery.forEach(r=>{const P=r.periods[p];if(P)add(P.src,{t:'회수 게이지: '+r.layer})});
 return m}
function drawer(){const m=usedIn(period),groups={};Object.keys(m).filter(id=>SRC[id]).forEach(id=>{(groups[srcType(id)]=groups[srcType(id)]||[]).push(id)});
 const order=['기업 공시','정부·국제기구 통계','기관 리서치·회사 발표','보도','Claude 계산'];
 document.getElementById('tDrawer').textContent=`근거 자료 ${Object.keys(m).filter(id=>SRC[id]).length}건`;
 document.getElementById('drawerIn').innerHTML=`<div style="font-size:13px;font-weight:700">근거 자료 · ${period}<span style="font-size:11px;color:#6f8a7a;font-weight:500;margin-left:8px">칩을 누르면 그 줄기나 패널로 갑니다 · 링크는 원문 새 창</span></div>`+
 order.filter(k=>groups[k]).map(k=>`<h4>${k} · ${groups[k].length}</h4>`+groups[k].map(id=>{const uniq=[];m[id].forEach(u=>{if(!uniq.find(x=>x.t===u.t))uniq.push(u)});
  return `<div class="it"><a href="${SRC[id].url}" target="_blank" rel="noopener" style="flex:1">${SRC[id].org} · ${SRC[id].title} <span style="color:#6f8a7a">(${SRC[id].date})</span></a>${uniq.slice(0,4).map(u=>`<span class="chip" data-f="${u.id||''}" data-g="${u.gap!=null?u.gap:''}">${u.t}</span>`).join('')}${uniq.length>4?`<span class="chip">+${uniq.length-4}</span>`:''}</div>`}).join('')).join('');
 document.querySelectorAll('#drawerIn .chip').forEach(c=>c.addEventListener('click',()=>{if(c.dataset.g!==''){cur=+c.dataset.g;focus=null;draw();showGap()}else if(c.dataset.f){const f=DATA.flows.find(x=>x.id===c.dataset.f)||DATA.side.find(x=>x.id===c.dataset.f)||DATA.inner.find(x=>x.id===c.dataset.f);if(f){const v=f.v[period];evid({title:f.name||`${nm(f.from)} → ${nm(f.to)}`,m:v.mid,lo:v.lo,hi:v.hi,g:(f.grade||{})[period]||'추정',basis:f.basis,calc:f.calc,src:f.src,id:f.id})}}}))}
const bind=(id,attr,fn)=>document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...e.currentTarget.querySelectorAll('button')].forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset[attr]);focus=null;draw();showGap();showRC();drawer()});
bind('seg','p',v=>period=v);bind('ruler','s',v=>ruler=v);bind('lane','l',v=>lane=v);
document.getElementById('tScale').addEventListener('click',e=>{same=!same;e.target.classList.toggle('on',same);draw()});
document.getElementById('tCake').addEventListener('click',e=>{cake=!cake;e.target.classList.toggle('on',cake);draw()});
document.getElementById('tLens').addEventListener('click',e=>{lens=!lens;e.target.classList.toggle('on',lens);draw()});
document.getElementById('tDrawer').addEventListener('click',e=>{const d=document.getElementById('drawer');d.classList.toggle('open');e.target.classList.toggle('on',d.classList.contains('open'))});
svg.addEventListener('click',()=>{if(focus){focus=null;draw();showGap()}});
draw();showGap();showRC();drawer();
