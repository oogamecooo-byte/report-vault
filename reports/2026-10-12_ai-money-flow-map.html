function rc3(){const box=document.getElementById('rc');const D=R3.defaults,CAP=2.5,W=150;
 const calcC=c=>{const rev=num(c.ai_revenue),asset=num(c.ai_asset_base);if(rev==null)return null;
  const own=asset!=null&&asset>0,life=own?(lifeO||num(c.life_policy_years)||num(D.life_years)||6):null,opex=(num(c.opex_ratio)||0)*rev,ex=num(c.reprice_exposure)||0;
  const den=(own?asset/life+asset*cocV:0)+opex;if(!den)return null;const nume=rev*(1-cutV*ex);return {nume,den,r:nume/den,life:life||'설비 없음(컴퓨트 임차)'}};
 const bar=r=>{const X=v=>Math.min(Math.max(v,0),CAP)/CAP*W,col=r>=1?'#7ddf9c':'#ff8a7a';return `<svg width="${W}" height="16"><rect x="0" y="6" width="${W}" height="4" rx="2" fill="rgba(233,242,236,.08)"/><line x1="${X(1)}" x2="${X(1)}" y1="1" y2="15" stroke="#e9f2ec" stroke-opacity=".55" stroke-dasharray="2 2"/><circle cx="${X(r)}" cy="8" r="5" fill="${col}"/></svg>`};
 const rows=R3.layers.map((L,i)=>{const C=(L.companies||[]).map(c=>({c,x:calcC(c)})).filter(o=>o.x);const n=C.reduce((a,o)=>a+o.x.nume,0),d=C.reduce((a,o)=>a+o.x.den,0);
  if(!d)return `<div class="rrow"><span class="nm">${L.layer}</span><span style="font-size:11px;color:#6f8a7a">자료 없음</span><span></span></div>`;
  const r=n/d,col=r>=1?'#7ddf9c':'#ff8a7a';
  return `<div class="rrow" data-l="${i}"><span class="nm">${openL[i]?'▾':'▸'} ${L.layer}</span>${bar(r)}<span class="nv" style="color:${col}">${r.toFixed(2)}배</span></div>`+
   (openL[i]?C.map(o=>`<div class="rrow" data-c="${i}|${o.c.name}" style="margin-top:4px;opacity:.88"><span class="nm" style="padding-left:14px;font-weight:500">${o.c.name}</span>${bar(o.x.r)}<span class="nv" style="font-size:11.5px;color:${o.x.r>=1?'#7ddf9c':'#ff8a7a'}">${o.x.r.toFixed(2)}배</span></div>`).join(''):'')}).join('');
 const base=num(D.reprice_cut)??.3,branch=cutV>base+1e-9?`논문 확률 트리 가격 마디: <b style="color:#ff8a7a">"더 하락" 가지</b>(기본 가정 ${Math.round(base*100)}%보다 더 내림)`:`논문 확률 트리 가격 마디: <b style="color:#7ddf9c">"기본 안" 가지</b>`;
 box.innerHTML=`<h3>회수 게이지 2.0 · 가정 바꿔 보기<span><span role="button" tabindex="0" id="rcBack" style="color:#e8b85a;cursor:pointer">기본 보기로</span></span></h3>
 <div style="display:grid;grid-template-columns:96px 1fr 62px;gap:4px 8px;align-items:center;font-size:11.5px;color:#a9bfb1;margin-top:8px">
  <span>GPU 내용연수</span><input type="range" id="sLife" min="3.5" max="7" step="0.5" value="${lifeO||3.5}" style="accent-color:#e8b85a"><span>${lifeO?lifeO+'년':'회사 정책'}</span>
  <span>재계약가 인하</span><input type="range" id="sCut" min="0" max="0.6" step="0.05" value="${cutV}" style="accent-color:#e8b85a"><span>${Math.round(cutV*100)}%</span>
  <span>자본비용</span><input type="range" id="sCoc" min="0" max="0.12" step="0.01" value="${cocV}" style="accent-color:#e8b85a"><span>${cocV?Math.round(cocV*100)+'%':'빼고 봄'}</span></div>
 ${rows}<div style="font-size:10.5px;color:#6f8a7a;margin-top:8px;line-height:1.45">${branch}<br>회수율 = AI 매출×(1−인하×재계약 노출) ÷ (AI 자산÷내용연수 + 운영비 + AI 자산×자본비용) — Claude 정의. 내용연수 슬라이더 맨 왼쪽 = 회사 정책. 층을 누르면 회사별로 펼치고, 회사를 누르면 근거가 열립니다.</div>`;
 box.querySelector('#sLife').addEventListener('input',e=>{const v=+e.target.value;lifeO=v<4?0:v;rc3()});
 box.querySelector('#sCut').addEventListener('input',e=>{cutV=+e.target.value;rc3()});
 box.querySelector('#sCoc').addEventListener('input',e=>{cocV=+e.target.value;rc3()});
 box.querySelector('#rcBack').addEventListener('click',e=>{e.preventDefault();rcMode='base';showRC()});
 box.querySelectorAll('.rrow[data-l]').forEach(el=>el.addEventListener('click',()=>{const i=+el.dataset.l;openL[i]=!openL[i];rc3()}));
 box.querySelectorAll('.rrow[data-c]').forEach(el=>el.addEventListener('click',()=>{const [i,name]=el.dataset.c.split('|');const c=R3.layers[+i].companies.find(x=>x.name===name),x=calcC(c),acc=[];
  document.getElementById('gap').innerHTML=`<div class="k">회수 게이지 2.0 · 회사</div><h2>${c.name} — ${R3.layers[+i].layer}<span class="badge b-${c.grade||'추정'}">${c.grade||'추정'}</span></h2>
  <div class="claim"><span class="who">AI 매출</span>${fmt(num(c.ai_revenue))}</div><div class="claim"><span class="who">AI 자산</span>${num(c.ai_asset_base)!=null?fmt(num(c.ai_asset_base))+' · 내용연수 '+x.life+'년'+(lifeO?' (슬라이더)':' (회사 정책)'):'설비 없음 — 비용 = 컴퓨트 사용료(운영비 비율)'}</div>
  <div class="claim"><span class="who">운영비 비율 · 재계약 노출</span>${Math.round((num(c.opex_ratio)||0)*100)}% · ${Math.round((num(c.reprice_exposure)||0)*100)}%</div>
  <div class="calc"><b>회수율 ${x.r.toFixed(2)}배</b> · ${c.calc||''}${srcLinks(c.src,acc)}</div>
  <div class="srcs">${acc.map((id,k)=>`[${k+1}] <a href="${SRC[id].url}" target="_blank" rel="noopener">${SRC[id].org} · ${SRC[id].title}</a> (${SRC[id].date})`).join('<br>')}${c.asof?`<br>기준일 ${c.asof}${stale(c.asof)?' · ⚠ 90일 넘음':''}`:''}</div>`}))}
function showRC(){if(rcMode==='v3'&&R3)return rc3();showRCbase();const h=document.querySelector('#rc h3 span');if(R3&&h){h.insertAdjacentHTML('beforeend',` · <span role="button" tabindex="0" id="rcGo" style="color:#e8b85a;cursor:pointer">가정 바꿔 보기</span>`);document.getElementById('rcGo').addEventListener('click',e=>{e.preventDefault();rcMode='v3';showRC()})}}

function srcType(id){const u=(SRC[id]&&SRC[id].url||'').toLowerCase(),o=(SRC[id]&&SRC[id].org||'');
 if(SRC[id]&&SRC[id].type)return SRC[id].type;
 if(/sec\.gov|investor|\/ir\b|ir\./.test(u)||/10-q|10-k|8-k|6-k/i.test(SRC[id].title||''))return '기업 공시';
 if(/\.gov|europa\.eu|worldbank|imf\.org|iea\.org|fred|census|bea\./.test(u))return '정부·국제기구 통계';
 if(/reuters|bloomberg|cnbc|ft\.com|wsj|axios|theinformation|lemonde|yahoo|guardian/.test(u))return '보도';
 if(/claude/i.test(o))return 'Claude 계산';
 return '기관 리서치·회사 발표'}
function evid(o){focus=o.id;draw();const acc=[];const box=document.getElementById('gap');
 box.innerHTML=`<div class="k">근거 카드 · ${period}</div><h2>${o.title}<span class="badge b-${o.g}">${o.g}</span></h2>
 <div class="claim"><span class="who">금액</span>${fmt(o.m)}${o.lo!=null&&o.lo!==o.hi?` · 범위 ${fmt(o.lo)}~${fmt(o.hi)}`:''} · 10억 달러${o.basis?` · ${o.basis}`:''}</div>
 ${o.ann&&o.ann.note?`<div class="claim"><span class="who">보도된 건 합계(협의 포함)</span>${o.ann.period||''} · ${o.ann.to_cloud_credit_x2!=null?fmt(o.ann.to_cloud_credit_x2):''}${o.ann.to_cloud_credit_x2_closed_only!=null?' · 협의 보도 빼면 '+fmt(o.ann.to_cloud_credit_x2_closed_only):''} · ${o.ann.note}</div>`:''}
 ${o.entries&&o.entries.length?(()=>{const by={};o.entries.forEach(e=>{(by[e.status]=by[e.status]||[]).push(e)});const ord=['확정','협의 보도','기관 추계'];
   return `<div class="claim"><span class="who">건별 원장</span>${ord.filter(k=>by[k]).map(k=>`${k} ${by[k].length}건 · ${fmt(by[k].reduce((a,e)=>a+(e.amount||0),0))}`).join(' / ')}</div>`+
   `<div style="font-size:11.3px;line-height:1.45;max-height:118px;overflow:auto">${o.entries.slice().sort((a,b)=>(b.amount||0)-(a.amount||0)).slice(0,8).map(e=>`<div style="padding:2px 0">${e.date||''} · ${e.borrower||''} · <b>${fmt(e.amount||0)}</b> · <span style="color:${e.status==='확정'?'#7ddf9c':e.status==='협의 보도'?'#e8b85a':'#7cc4ff'}">${e.status}</span>${e.measure==='stock'?' · 누적 약정':''}${e.circular?' · 순환':''}${srcLinks(e.src,acc)}</div>`).join('')}</div>`})():''}
 ${o.stock&&o.stock.value!=null?`<div class="claim"><span class="who">누적 약정(굵기에 안 더함)</span>${fmt(o.stock.value)} · ${o.stock.calc||''}${srcLinks(o.stock.src,acc)}</div>`:''}
 ${o.calc?`<div class="calc"><b>어떻게 얻었나</b> · ${o.calc}${srcLinks(o.src,acc)}</div>`:''}
 <div class="srcs" style="margin-top:4px">${(o.src||[]).filter(id=>SRC[id]).map(id=>`<div style="padding:4px 0;border-top:1px solid rgba(233,242,236,.12)"><span style="color:#e8b85a">${srcType(id)}</span><br><a href="${SRC[id].url}" target="_blank" rel="noopener">${SRC[id].org} · ${SRC[id].title}</a> (${SRC[id].date})</div>`).join('')||'출처 없음 — Claude 추정'}</div>
 <div style="font-size:10.5px;color:#6f8a7a">빈 곳을 누르면 강조가 풀립니다</div>`}
function usedIn(p){const m={};const add=(ids,label)=>(ids||[]).forEach(id=>{(m[id]=m[id]||[]).push(label)});
 DATA.flows.forEach(f=>{if(getV(f,p))add(f.src,{id:f.id,t:`${nm(f.from)}→${nm(f.to)}`})});
 (LOBJ||[...DATA.side,...DATA.inner]).forEach(x=>{if(getV(x,p)){add(x.src,{id:x.id,t:x.name});(x.entries||[]).forEach(e=>add(e.src,{id:x.id,t:x.name+' 원장'}))}});
 DATA.gaps.forEach(g=>{const P=g.periods[anchorOf(p)];if(!P)return;(P.claims||[]).forEach(c=>add(c.src,{gap:g.r,t:'패널: '+g.title}));if(P.calc)add(P.calc.src,{gap:g.r,t:'패널: '+g.title})});
 DATA.recovery.forEach(r=>{const P=r.periods[anchorOf(p)];if(P)add(P.src,{t:'회수 게이지: '+r.layer})});
 return m}
function drawer(){const m=usedIn(period),groups={};Object.keys(m).filter(id=>SRC[id]).forEach(id=>{(groups[srcType(id)]=groups[srcType(id)]||[]).push(id)});
 const order=['기업 공시','정부·국제기구 통계','기관 리서치·회사 발표','보도','Claude 계산'];
 document.getElementById('tDrawer').textContent=`근거 자료 ${Object.keys(m).filter(id=>SRC[id]).length}건`;
 document.getElementById('drawerIn').innerHTML=`<div style="font-size:13px;font-weight:700">근거 자료 · ${period}<span style="font-size:11px;color:#6f8a7a;font-weight:500;margin-left:8px">칩을 누르면 그 줄기나 패널로 갑니다 · 링크는 원문 새 창</span></div>`+
 order.filter(k=>groups[k]).map(k=>`<h4>${k} · ${groups[k].length}</h4>`+groups[k].map(id=>{const uniq=[];m[id].forEach(u=>{if(!uniq.find(x=>x.t===u.t))uniq.push(u)});
  return `<div class="it"><a href="${SRC[id].url}" target="_blank" rel="noopener" style="flex:1">${SRC[id].org} · ${SRC[id].title} <span style="color:#6f8a7a">(${SRC[id].date})</span></a>${uniq.slice(0,4).map(u=>`<span class="chip" data-f="${u.id||''}" data-g="${u.gap!=null?u.gap:''}">${u.t}</span>`).join('')}${uniq.length>4?`<span class="chip">+${uniq.length-4}</span>`:''}</div>`}).join('')).join('');
 document.querySelectorAll('#drawerIn .chip').forEach(c=>c.addEventListener('click',()=>{if(c.dataset.g!==''){cur=+c.dataset.g;focus=null;draw();showGap()}else if(c.dataset.f){const f=DATA.flows.find(x=>x.id===c.dataset.f)||(LOBJ||[]).find(x=>x.id===c.dataset.f)||DATA.side.find(x=>x.id===c.dataset.f)||DATA.inner.find(x=>x.id===c.dataset.f);if(f){const v=getV(f,period)||{mid:0};evid({title:f.name||`${nm(f.from)} → ${nm(f.to)}`,m:v.mid,lo:v.lo,hi:v.hi,g:(f.grade||{})[period]||'추정',basis:f.basis,calc:f.calc,src:f.src,id:f.id})}}}))}
const bind=(id,attr,fn)=>document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...e.currentTarget.querySelectorAll('button')].forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset[attr]);focus=null;draw();showGap();showRC();drawer()});
bind('ruler','s',v=>ruler=v);bind('lane','l',v=>lane=v);
document.getElementById('tScale').addEventListener('click',e=>{same=!same;e.target.classList.toggle('on',same);draw()});
document.getElementById('tCake').addEventListener('click',e=>{cake=!cake;e.target.classList.toggle('on',cake);renderLabels(cake?FROWS:ROWS0);focus=null;draw();showGap()});
document.getElementById('tLens').addEventListener('click',e=>{lens=!lens;e.target.classList.toggle('on',lens);draw()});
document.getElementById('tDrawer').addEventListener('click',e=>{const d=document.getElementById('drawer');d.classList.toggle('open');e.target.classList.toggle('on',d.classList.contains('open'))});
svg.addEventListener('click',()=>{if(focus){focus=null;draw();showGap()}});
const TS=document.getElementById('tslider'),TL=document.getElementById('tlabel');TS.max=PERIODS.length-1;TS.value=PERIODS.indexOf('2026');
const setP=i=>{period=PERIODS[i];TS.value=i;TL.textContent=plabel(period)+(isQ(period)?' · 보간':'');focus=null;draw();showGap();showRC();drawer()};
TS.addEventListener('input',e=>setP(+e.target.value));
let timer=null;document.getElementById('play').addEventListener('click',e=>{if(timer){clearInterval(timer);timer=null;e.target.textContent='▶';return}e.target.textContent='❚❚';let i=0;setP(0);timer=setInterval(()=>{i++;if(i>=PERIODS.length){clearInterval(timer);timer=null;e.target.textContent='▶';return}setP(i)},900)});
TL.textContent=plabel(period);
draw();showGap();showRC();drawer();
</script>
</body>
