 if(!c){m.textContent="코드를 입력하세요.";return;}
 if(!(window.crypto&&crypto.subtle)){m.textContent="이 브라우저에서는 열 수 없습니다(HTTPS 필요).";return;}
 b.disabled=true;m.style.color="#6b6455";m.textContent="여는 중…";
 try{
  var r=u8(el.getAttribute("data-p")),s=r.slice(0,16),v=r.slice(16,28),ct=r.slice(28);
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(c),"PBKDF2",false,["deriveKey"]);
  var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:N,hash:"SHA-256"},
        km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:v},k,ct);
  el.outerHTML=new TextDecoder().decode(pt);
 }catch(e){m.style.color="#a33";m.textContent="코드가 맞지 않습니다.";b.disabled=false;i.value="";i.focus();}
}

i.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();go();}});
})();
