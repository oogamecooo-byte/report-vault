<script>
(function(){
var S="oZYGPFZ/Gr/zlIcImkgWQw==",N=600000,LS="vault_k1";
function b2a(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function a2b(a){var s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
async function derive(pw){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b2a(S),iterations:N,hash:"SHA-256"},km,256));
}
async function open(raw){
  var d=b2a(document.getElementById("vd").textContent.trim());
  var k=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"]);
  var z=await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},k,d.slice(12));
  var st=new Blob([z]).stream().pipeThrough(new DecompressionStream("deflate"));
  return await new Response(st).text();
}
function show(html){
  var h=location.hash;
  document.open();document.write(html);document.close();
  if(h&&h.length>1)setTimeout(function(){try{var e=document.getElementById(decodeURIComponent(h.slice(1)));if(e)e.scrollIntoView()}catch(_){}},60);
}

  var saved=null;try{saved=localStorage.getItem(LS)}catch(_){}

})();
