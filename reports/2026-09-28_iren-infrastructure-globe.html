<!DOCTYPE html>
<html lang="ko">
<head>

<title>IREN 인프라 지구본</title>
<meta name="vault-stage" content="Analysis">
<meta name="vault-topic" content="IREN 인프라">

<meta name="description" content="IREN 데이터센터 사이트 9곳(미국·캐나다·호주·스페인)을 돌아가는 지구본 위에 올린 인터랙티브 대시보드. 사이트를 누르면 현황·시점별 전개·자금·8/28 이후 새로 나온 사실·쟁점이 열리고, 시간 탭(지금·2026 말·2027·2028+)에 따라 지구 위에 켜지는 용량이 바뀐다. 1차 공시 기반 · 매수·매도 신호 아님.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@600;700;900&display=swap">
<style>
:root{--ink-900:#061423;--ink-850:#08192B;--ink-800:#0B2138;--ink-750:#0E2842;--rule:#1B3A5A;--rule-soft:#102B45;
  --paper:#E6EDF5;--paper-dim:#B7C7D8;--muted:#7E97AE;--legacy:#E0A33E;--token:#4FD1E8;--token-lt:#8FE6F4;--warn:#F2857B;--mix:#B9A2F0;--s:1;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;background:#030B15;color:var(--paper);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;color:inherit;}
#sky{position:fixed;inset:0;width:100vw;height:100vh;}
.stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s));}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}

/* 왼쪽 */
.left{position:absolute;left:0;top:0;bottom:44px;width:420px;padding:30px 26px 16px 44px;display:flex;flex-direction:column;z-index:5;
  background:linear-gradient(90deg,rgba(6,20,35,.94) 70%,rgba(6,20,35,0));}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.14em;color:var(--token);display:flex;align-items:center;gap:12px;}
.eyebrow::after{content:"";height:1px;flex:1;max-width:120px;background:linear-gradient(90deg,var(--token),transparent);}
h1{font-family:"Noto Serif KR",serif;font-weight:900;font-size:40px;line-height:1.15;margin:10px 0 4px;letter-spacing:-.02em;}
.asof{font-size:12px;color:var(--muted);line-height:1.5;}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
.kpi{border:1px solid var(--rule);background:rgba(11,33,56,.7);padding:9px 12px;}
.kpi b{display:block;font-size:11.5px;color:var(--muted);font-weight:500;}
.kpi .v{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:600;color:#fff;line-height:1.25;}
.kpi span{font-size:11px;color:var(--paper-dim);}
.ttl{font-size:12px;letter-spacing:.1em;color:var(--muted);margin:16px 0 6px;}
.times{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);}
.times button{background:transparent;border:none;border-right:1px solid var(--rule);padding:7px 4px;cursor:pointer;text-align:center;transition:.25s;}
.times button:last-child{border-right:none;}
.times button b{display:block;font-size:14px;} .times button span{font-size:11px;color:var(--muted);}
.times button.on{background:linear-gradient(180deg,rgba(79,209,232,.2),rgba(79,209,232,.04));box-shadow:inset 0 -2px 0 var(--token);}
.tot{font-size:12.5px;color:var(--paper-dim);line-height:1.55;margin-top:8px;min-height:40px;}
.slist{flex:1;overflow:auto;margin-top:6px;padding-right:4px;}
.slist::-webkit-scrollbar{width:5px;} .slist::-webkit-scrollbar-thumb{background:var(--rule);}
.grp{font-size:11.5px;letter-spacing:.1em;color:var(--muted);margin:10px 0 4px;}
.site{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;width:100%;border:1px solid transparent;background:transparent;padding:6px 8px;cursor:pointer;text-align:left;transition:.2s;}
.site:hover{background:rgba(22,69,107,.35);border-color:var(--rule);}
.site.on{background:rgba(79,209,232,.1);border-color:rgba(79,209,232,.5);}
.site i{width:10px;height:10px;border-radius:50%;display:block;box-shadow:0 0 8px currentColor;}
.site b{font-size:14.5px;font-weight:500;} .site small{display:block;font-size:11.5px;color:var(--muted);}
.site .gw{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--paper-dim);text-align:right;}
.site .gw em{font-style:normal;display:block;font-size:11px;color:var(--token-lt);}

/* 지구본 */
#globe{position:absolute;left:0;top:0;width:1600px;height:856px;cursor:grab;z-index:1;}
#globe.drag{cursor:grabbing;}
.legend{position:absolute;left:450px;bottom:58px;display:flex;gap:18px;font-size:12.5px;color:var(--paper-dim);z-index:4;align-items:center;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.legend .ring{border:1.5px solid var(--paper-dim);background:transparent;width:14px;height:14px;}
.note{position:absolute;right:30px;bottom:58px;font-size:11.5px;color:var(--muted);z-index:4;text-align:right;line-height:1.5;}
.zoom{position:absolute;right:30px;top:30px;display:flex;flex-direction:column;gap:6px;z-index:4;transition:right .5s cubic-bezier(.2,.7,.2,1);}
.zoom button{width:40px;height:40px;border:1px solid var(--rule);background:rgba(11,33,56,.85);cursor:pointer;font-size:17px;}
.zoom button:hover{border-color:var(--token);}
body.pan .zoom{right:650px;}
.tip{position:absolute;pointer-events:none;z-index:6;background:rgba(8,25,43,.95);border:1px solid var(--rule);padding:6px 10px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .15s;}
.tip b{font-weight:700;} .tip span{color:var(--muted);font-size:12px;margin-left:6px;}

/* 사이트 창 */
.panel{position:absolute;top:0;right:0;bottom:44px;width:620px;z-index:10;background:linear-gradient(180deg,rgba(12,35,59,.97),rgba(8,25,43,.98));
  border-left:1px solid var(--rule);box-shadow:-24px 0 60px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .55s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;}
.panel.open{transform:none;}
.ph{padding:22px 28px 14px;border-bottom:1px solid var(--rule);position:relative;}
.ph .x{position:absolute;right:20px;top:18px;width:36px;height:36px;border:1px solid var(--rule);background:transparent;cursor:pointer;}
.ph .x:hover{border-color:var(--token);}
.ph .loc{font-size:12.5px;color:var(--muted);letter-spacing:.06em;}
.ph h2{font-family:"Noto Serif KR",serif;font-size:34px;margin:4px 0 0;line-height:1.2;}
.ph .row{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:14px;color:var(--paper-dim);}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);padding:3px 10px;font-size:13px;}
.chip i{width:8px;height:8px;border-radius:50%;}
.ptabs{display:flex;gap:6px;margin-top:12px;}
.ptabs button{flex:1;border:1px solid var(--rule);background:transparent;padding:6px 4px;cursor:pointer;font-size:13px;color:var(--paper-dim);}
.ptabs button.on{border-color:var(--token);color:#fff;background:rgba(79,209,232,.12);}
.pb{padding:14px 28px 26px;overflow:auto;flex:1;}
.pb::-webkit-scrollbar{width:6px;} .pb::-webkit-scrollbar-thumb{background:var(--rule);}
.capbar{margin-top:4px;}
.capbar .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);}
.capbar .tr{height:10px;background:var(--rule-soft);position:relative;margin-top:5px;}
.capbar .fl{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--token),var(--token-lt));transition:width .7s cubic-bezier(.2,.7,.2,1);}
.sec{margin-top:16px;}
.sec h4{margin:0 0 7px;font-size:12.5px;letter-spacing:.08em;color:var(--token);font-weight:500;}
.sec.now{border-left:3px solid var(--token);padding-left:14px;}
.sec.now p{margin:0;font-size:15.5px;line-height:1.66;color:var(--paper);}
.sec ul{margin:0;padding-left:18px;} .sec li{font-size:14.5px;line-height:1.6;color:var(--paper-dim);margin:4px 0;font-weight:300;}
.nw{border:1px solid var(--rule);background:rgba(8,25,43,.6);padding:9px 12px;margin-top:8px;font-size:14px;line-height:1.6;color:var(--paper-dim);}
.nw .d{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--legacy);margin-right:8px;}
.nw a{color:var(--token-lt);font-size:12.5px;margin-left:6px;text-decoration:none;} .nw a:hover{text-decoration:underline;}
.sec.open li{color:var(--paper-dim);}
.none{font-size:14px;color:var(--muted);}

/* 읽는 법 */
.guidebtn{position:absolute;left:44px;bottom:56px;z-index:6;}
.rail{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:22px;padding:0 44px;border-top:1px solid var(--rule);background:rgba(8,25,43,.95);z-index:20;}
.rail .nm{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.1em;color:var(--muted);}
.rail .t{font-size:13px;color:var(--paper-dim);}
.rail .keys{margin-left:auto;font-size:12.5px;color:var(--muted);}
.rail .keys span{font-family:"IBM Plex Mono",monospace;border:1px solid var(--rule);padding:0 5px;margin:0 3px 0 10px;}
</style>
</head>

  h+=`<div class="sec open"><h4>쟁점 · 공란</h4><ul>${s.open.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  $('#pBody').innerHTML=h; if(!keep)$('#pBody').scrollTop=0;}

// ── 왼쪽 ──
function renderLeft(){$('#asof').textContent=COMPANY.asof;
  $('#kpis').innerHTML=COMPANY.kpi.map(k=>`<div class="kpi"><b>${k[0]}</b><div class="v">${k[1]}</div><span>${k[2]}</span></div>`).join('');}
function setTime(t){S.t=Math.max(0,Math.min(3,t));
  $('#times').innerHTML=TIMES.map((x,i)=>`<button class="${i===S.t?'on':''}" data-t="${i}"><b>${x.k}</b><span>${x.s}</span></button>`).join('');
  $$('#times button').forEach(b=>b.onclick=()=>setTime(+b.dataset.t));
  $('#tot').textContent=TIMES[S.t].tot; renderList(); if(S.sel)renderPanel(true); crumb();}
function renderList(){let h='';['na','bc','au','eu'].forEach(k=>{h+=`<div class="grp">${GRPN[k]}${k==='na'?' · 텍사스·오클라호마':k==='bc'?' · BC':''}</div>`;
  SITES.filter(s=>s.grp===k).forEach(s=>{const c=capAt(s,S.t);
    h+=`<button class="site ${S.sel===s.id?'on':''}" data-id="${s.id}"><i style="color:${COL[s.st]};background:${COL[s.st]}"></i><span><b>${s.n}</b><small>${s.stL}</small></span><span class="gw">${s.head.split(' ')[0]}${S.t>0?`<em>${c?c.toLocaleString()+'MW':'—'}</em>`:''}</span></button>`;});});
  $('#slist').innerHTML=h;$$('#slist .site').forEach(b=>b.onclick=()=>openSite(b.dataset.id));}
function crumb(){const s=SITES.find(q=>q.id===S.sel);$('#crumb').textContent=`${TIMES[S.t].k}${s?' › '+s.n:' › 전체'}`;}
$('#pClose').onclick=closePanel;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.sel)closePanel();else $('#zhome').click();}
  else if(e.key==='ArrowRight'){setTime(S.t+1);e.preventDefault();} else if(e.key==='ArrowLeft'){setTime(S.t-1);e.preventDefault();}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){const i=SITES.findIndex(q=>q.id===S.sel);const n=e.key==='ArrowDown'?(i+1)%SITES.length:(i<=0?SITES.length-1:i-1);openSite(SITES[n].id);e.preventDefault();}
  else if(e.key==='+'||e.key==='='){$('#zin').click();} else if(e.key==='-'){$('#zout').click();}});

// ── 배경 ──
const sk=$('#sky'),sc=sk.getContext('2d');
function sky(){sk.width=innerWidth*devicePixelRatio;sk.height=innerHeight*devicePixelRatio;const W=sk.width,H=sk.height;
  const gr=sc.createRadialGradient(W*.6,H*.45,0,W*.6,H*.45,W*.8);gr.addColorStop(0,'#0B2138');gr.addColorStop(1,'#030B15');sc.fillStyle=gr;sc.fillRect(0,0,W,H);
  let x=11;const r=()=>{x=(x*9301+49297)%233280;return x/233280;};for(let i=0;i<420;i++){sc.globalAlpha=.15+r()*.6;sc.fillStyle='#DDEBFF';sc.beginPath();sc.arc(r()*W,r()*H,(r()*1.2+.2)*devicePixelRatio,0,7);sc.fill();}sc.globalAlpha=1;}

fit();renderLeft();setTime(0);renderList();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
