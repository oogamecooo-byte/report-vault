name: jh2026-fetch
on:
  push:
    branches: ['claude/jackson-hole-2026-translation-79apfi']
    paths: ['.github/workflows/jh2026-fetch.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch symposium page and PDFs
        run: |
          set -e
          mkdir -p _jh2026_raw
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          fetch() { curl -sSL --retry 3 --retry-delay 2 -A "$UA" -H "Accept-Language: en-US,en;q=0.9" "$1" -o "$2"; }
          fetch "https://www.kansascityfed.org/research/jackson-hole-economic-symposium/2026/" _jh2026_raw/page.html
          grep -oE 'href="[^"]+"' _jh2026_raw/page.html | sed 's/^href="//;s/"$//' | sort -u > _jh2026_raw/links.txt
          grep -iE '(\.pdf|/documents/)' _jh2026_raw/links.txt > _jh2026_raw/pdf_links.txt || true
          echo "---- candidate links ----"; cat _jh2026_raw/pdf_links.txt || true
          i=0
          while read -r u; do
            case "$u" in
              http*) ;;
              /*) u="https://www.kansascityfed.org$u";;
              *) continue;;
            esac
            i=$((i+1))
            fn=$(basename "${u%%\?*}")
            [ -z "$fn" ] && fn="doc"
            case "$fn" in *.pdf|*.PDF) ;; *) fn="${fn}.pdf";; esac
            echo "$u -> ${i}_${fn}"
            fetch "$u" "_jh2026_raw/${i}_${fn}" || echo "FAILED $u"
            echo "$u|${i}_${fn}" >> _jh2026_raw/url_map.txt
          done < _jh2026_raw/pdf_links.txt
          ls -la _jh2026_raw
          file _jh2026_raw/* || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f _jh2026_raw
          git commit -m "jh2026 raw fetch [skip ci]" || echo "nothing to commit"
          git push
